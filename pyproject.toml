[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyptine"
dynamic = ["version"]
description = "Python client for the API of Statistics Portugal (INE): catalogue, metadata, data, with provenance"
authors = [{name = "Nigel Randsley", email = "nigel.randsley@protonmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["ine", "portugal", "statistics", "data", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "click>=8.0.0",
    "requests-cache>=1.0.0",
    "pydantic>=2.0.0",
    "platformdirs>=3.0.0",
    "rich>=13.0.0",
    "plotly>=5.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.22.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "openpyxl>=3.0.0",
]
excel = [
    "openpyxl>=3.0.0",
]

[project.scripts]
pyptine = "pyptine.cli.main:cli"

[project.urls]
Homepage = "https://github.com/randsley/pyptine"
Repository = "https://github.com/randsley/pyptine"
Issues = "https://github.com/randsley/pyptine/issues"
Changelog = "https://github.com/randsley/pyptine/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "pyptine.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyptine*"]  # not src/examples: it would install a top-level "examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests (tests/live/, against INE) are deselected; run them with `pytest -m live`.
addopts = "-v --cov=pyptine --cov-report=term-missing -m 'not live'"
markers = [
    "live: tests against the live INE API (tests/live/); deselected unless `-m live`",
    "asyncio: marks tests as async",
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
