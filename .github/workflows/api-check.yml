name: API check

# Weekly: does INE's API still return the fields pyptine reads, and do the documented traps
# still hold? See tools/check_api.py. A failed scheduled run emails the repo owner.
# 07:00 UTC Monday, half an hour after PortugalINE.jl's check: INE answers bursts with 404.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/check_api.py
      - tools/api_baseline.json
      - .github/workflows/api-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python tools/check_api.py
