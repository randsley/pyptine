name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Offline: every test runs on INE's recorded responses (tests/fixtures/ine/).
      - name: Run tests with pytest
        run: pytest tests/ --cov=src/pyptine --cov-report=term

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with Black
        run: black --check src/ tests/ tools/

      - name: Lint with Ruff
        run: ruff check src/ tests/ tools/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  package:
    # Builds the sdist and wheel and checks what PyPI would receive.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the distributions
        run: |
          twine check --strict dist/*
          # The wheel holds the pyptine package only (src/examples once leaked in).
          python -c "import sys, zipfile, glob; tops = {n.split('/')[0] for n in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()}; extra = {t for t in tops if not t.startswith('pyptine')}; sys.exit(f'unexpected top-level entries in the wheel: {extra}' if extra else 0)"
